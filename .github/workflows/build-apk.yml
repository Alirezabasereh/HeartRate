name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Android cmdline-tools to PATH
        run: |
          echo "ANDROID_HOME is: $ANDROID_HOME"
          SDKMANAGER_BIN_DIR=$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -type f -name "sdkmanager" | head -n 1)")
          echo "Found sdkmanager in: $SDKMANAGER_BIN_DIR"
          echo "$SDKMANAGER_BIN_DIR" >> "$GITHUB_PATH"

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.1

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeartRateApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
